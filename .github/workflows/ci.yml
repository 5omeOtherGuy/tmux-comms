name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install tmux and shellcheck
        run: sudo apt-get update && sudo apt-get install -y tmux shellcheck
      - name: tmux version
        run: tmux -V
      # The gate runs twice: on the oldest supported Python (the floor in README.md) and on the
      # newest release.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: gate (Python 3.11, the floor)
        run: python3 --version && scripts/gate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: gate (newest Python)
        run: python3 --version && scripts/gate
