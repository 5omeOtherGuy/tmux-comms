name: ci
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: install tmux and shellcheck
        run: sudo apt-get update && sudo apt-get install -y tmux shellcheck
      - name: tmux version
        run: tmux -V
      - name: secret scan
        run: tools/secret-scan.sh
      - name: test suite
        run: bash tests/run-tests.sh
